name: Release JRemote

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package for Windows
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine Version
        id: get_version
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $tag = "${{ github.ref_name }}"
            $ver = $tag.TrimStart('v')
          } elseif ("${{ inputs.version }}" -ne "") {
            $ver = "${{ inputs.version }}"
            $tag = "v$ver"
          } else {
            $ver = "1.0.0"
            $tag = "v1.0.0"
          }
          Write-Output "VERSION=$ver" >> $env:GITHUB_ENV
          Write-Output "TAG_NAME=$tag" >> $env:GITHUB_ENV
          Write-Host "Releasing version: $ver with tag: $tag"

      - name: Download External Tools (adb & scrcpy)
        shell: pwsh
        run: |
          .\scripts\download-tools.ps1

      - name: Package JRemote (Self-Contained win-x64)
        shell: pwsh
        run: |
          .\scripts\package.ps1 -Version ${{ env.VERSION }} -Runtime "win-x64"

      - name: Upload Artifact to Run Summary
        uses: actions/upload-artifact@v4
        with:
          name: JRemote-v${{ env.VERSION }}-win-x64
          path: release/JRemote-v${{ env.VERSION }}-win-x64.zip

      - name: Create GitHub Release & Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: JRemote ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/JRemote-v${{ env.VERSION }}-win-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
